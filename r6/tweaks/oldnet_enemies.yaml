    - CorruptionAura

  behavior:
    ethereal: true
    canBeTargeted: true
    immuneToPhysicalCC: true  # Immune to knockdown, grapple

  spawnWeight:
    depth1: 0.0
    depth2: 0.0
    depth3: 0.3
    depth4: 0.6
    depth5: 1.0

  loot:
    - Items.DigitalFragments
    - Items.CorruptedData

  visualEffects:
    bodyType: "translucent_digital"
    color: [0.2, 0.5, 1.0]
    particleEffect: "digital_manifestation.particle"
    trailEffect: "digital_trail.particle"

