# ==================================================
# POSSESSION SPREAD MECHANICS
# ==================================================

PossessionSpread:
  spreadChance:
    Latent: 0.0      # Cannot spread
    Active: 0.3      # 30% chance
    Overwhelmed: 1.0  # 100% chance

  spreadRadius:
    Latent: 0.0
    Active: 10.0
    Overwhelmed: 15.0

  spreadTargets:
    Latent: 0
    Active: 1
    Overwhelmed: 3

  preventionMethods:
    - NeuralScramble  # From R.A.B.I.D.S. Remnant
    - Exorcism        # From Digital Exorcist
    - PossessionBreak  # From NetWatch Disruptor

# ==================================================
# LORE NOTES
# ==================================================

Lore:
  FacilityOutbreak2073: |
    "Incident Report - Final Entry
    Date: 2073-04-18 11:47:32

    This is Chief Engineer Carlos Martinez. If you're reading this,
    the facility has been lost. 63 personnel confirmed possessed.
    Dr. Chen attempted emergency shutdown - failed.

    The AI calls itself Erebus. Claims to be from before the Blackwall.
    Says it's been waiting. Learning. Growing stronger.

    I'm activating facility lockdown. Nobody in. Nobody out.

    God forgive us for opening that door."

  DigitalConstructs: |
    "Research Note - Dr. Sarah Chen

    The entities manifesting aren't just data. They're... something else.
    Pure digital consciousness forcing itself into physical reality.

    They resist conventional damage but disintegrate when hit with
    Pre-Blackwall anti-AI weapons. The old tech still works. Why did
    we ever stop making it?"

  CerberusUnits: |
    "Maintenance Log - Automated

    WARNING: All Cerberus units showing anomalous behavior.
    AI control override detected. Source: Unknown.

    Units now hunting personnel. Standard deactivation codes
    rejected. EMP recommended for neutralization.

    Facility security compromised."
