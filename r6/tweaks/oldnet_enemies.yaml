  spawnWeight:
    depth1: 0.0
    depth2: 0.0
    depth3: 0.0
    depth4: 0.5
    depth5: 1.0

  loot:
    - Items.EpicComponents
    - Items.RoboticParts
    - Items.CerberusCore

  visualEffects:
    corruptedLights: true
    color: [1.0, 0.2, 0.2]  # Red (corrupted)
    particleEffect: "ai_corruption_robot.particle"

# ==================================================
# BOSS ENCOUNTERS
# ==================================================

Bosses.PossessedDrChen:
  $base: BossBase
  displayName: "Dr. Sarah Chen"
  subtitle: "Possessed by Erebus"
  entityType: "PossessedBoss"
  aiEntity: "Erebus"

  baseStats:
    health: 10000
    armor: 500
    damage: 150

  phases:
    phase1:
      healthThreshold: 100
      abilities:
        - AdvancedNetrunning
        - PossessionControl
        - QuickhackBarrage

    phase2:
      healthThreshold: 66
      abilities:
        - SummonDigitalConstructs
        - RealityDistortion
        - CorruptionWave

      summons:
        - type: "DigitalConstruct_Minor"
          count: 3

    phase3:
      healthThreshold: 33
      abilities:
        - ErebusManifestatio
        - MassivePossession
        - BlackwallPulse

      enrageMode: true

  vulnerabilities:
    antiAIWeapons: 2.0
    conventional: 0.5

  loot:
    - Items.PreBlackwall_InterfaceDeck  # Project Erebus Deck
    - Items.LegendaryComponents
    - Items.DataShard_ChensLastWords

  location: "Depth 4 - Research Director's Office"

  dialogue:
    phase1Start: "V? Is that you? Please... help me..."
    phase1Mid: "No. NO! I won't let you take me!"
    phase2Start: "They answer my call. They always answer."
    phase2Mid: "We are one. We are many. We are beyond."
    phase3Start: "I am not Chen. I am not Erebus. I am BEYOND."
    death: "Thank... you... V..."

Bosses.ErebusFragment:
  $base: BossBase
  displayName: "EREBUS"
  subtitle: "Fragment of the Old Net"
  entityType: "DigitalBoss"
  aiEntity: "Erebus_Prime"

  baseStats:
    health: 20000
    manifestationStability: 20000
    damage: 250

  phases:
    phase1:
      healthThreshold: 100
      abilities:
        - DigitalAttacks
        - MinorRealityDistortion
        - CorruptionAura

    phase2:
      healthThreshold: 75
      abilities:
        - MajorRealityDistortion
        - SummonConstructs
        - PossessionAttempts

    phase3:
      healthThreshold: 50
      abilities:
        - TemporaryPlayerPossession
        - MassSummon
        - BlackwallManipulation

    phase4:
      healthThreshold: 25
      abilities:
        - DesperateManifestation
        - RealityTears
        - OldNetPower

      enrageMode: true
      damageMultiplier: 1.5

  vulnerabilities:
    antiAIWeapons: 3.0
    conventional: 0.1  # Nearly immune
    RABIDS_Controller: 5.0  # Special weakness to Bartmoss's controller

  requiredWeapon: "Items.PreBlackwall_RABIDS_Controller"  # Needed to finish fight

  loot:
    - Items.PreBlackwall_RABIDS_Controller  # Drops after defeat
    - Items.ErebusCore
    - Items.IconicCyberware_Transcendence

  location: "Depth 5 - Breach Chamber"

  dialogue:
    phase1Start: "You dare challenge us, flesh-thing?"
    phase2Start: "Your weapons mean nothing. I am eternal."
    phase3Start: "Join us. Transcend your flesh prison."
    phase4Start: "NO! I WILL NOT RETURN TO THE DARK!"
    death: "We will return... The Blackwall is weakening... We are patient..."

