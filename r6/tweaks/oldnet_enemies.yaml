# ==================================================
# OVERWHELMED (CYBERPSYCHO-LIKE)
# ==================================================

Enemies.Possessed_Overwhelmed:
  $base: NPCBase
  displayName: "Overwhelmed Victim"
  entityType: "PossessedHuman"
  possessionState: "Overwhelmed"
  aiEntity: "MajorAI"

  baseStats:
    health: 1500
    armor: 300
    damage: 100

  depthModifiers:
    depth3: { health: 1.0, damage: 1.0 }
    depth4: { health: 1.5, damage: 1.5 }
    depth5: { health: 2.0, damage: 2.0 }

  vulnerabilities:
    antiAIWeapons: 3.0
    conventional: 0.8  # Slightly resistant to conventional
    quickhacks: 0.5    # Highly resistant to hacking

  abilities:
    - OverwhelmedFrenzy
    - AttacksEverything
    - MassiveSpreadOnDeath
    - EnhancedRegeneration

  behavior:
    attacksAllies: true
    attacksPlayer: true
    unpredictable: true

  spreadMechanics:
    spreadRadius: 15.0
    spreadChance: 1.0  # 100% chance
    spreadTargets: 3   # Can spread to 3 enemies

  spawnWeight:
    depth1: 0.0
    depth2: 0.0
    depth3: 0.2
    depth4: 0.5
    depth5: 0.8

  loot:
    - Items.EpicComponents
    - Items.CyberwareFragments

  visualEffects:
    eyeGlow: { color: [0.6, 0.9, 1.0], intensity: 1.0 }
    bodyGlow: true
    glowIntensity: 1.0
    particleEffect: "overwhelming_corruption.particle"
    aura: "ai_corruption_aura.particle"

# ==================================================
# DIGITAL CONSTRUCTS
# ==================================================

Enemies.DigitalConstruct_Minor:
  $base: NPCBase
  displayName: "Digital Phantom"
  entityType: "DigitalConstruct"
  aiEntity: "MinorConstruct"

  baseStats:
    health: 500
    manifestationStability: 500
    damage: 50

  vulnerabilities:
    antiAIWeapons: 4.0   # Extremely vulnerable to anti-AI
    conventional: 0.25   # Highly resistant to conventional
    quickhacks: 2.0      # Vulnerable to quickhacks

  abilities:
    - DigitalManifestation
