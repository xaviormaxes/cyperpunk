# Old Net Enemies Configuration
# Beyond the Wall Mod
# Enemy types from the 2073 Facility 7-B outbreak and Old Net entities

# ==================================================
# POSSESSED FACILITY PERSONNEL
# ==================================================

Enemies.Possessed_Researcher:
  $base: NPCBase
  displayName: "Possessed Researcher"
  entityType: "PossessedHuman"
  possessionState: "Latent"
  aiEntity: "MinorAI"

  baseStats:
    health: 300
    armor: 50
    damage: 25

  depthModifiers:
    depth1: { health: 1.0, damage: 1.0 }
    depth2: { health: 1.3, damage: 1.3 }
    depth3: { health: 1.6, damage: 1.6 }

  vulnerabilities:
    antiAIWeapons: 3.0  # Takes 3x damage from anti-AI weapons
    conventional: 1.0

  abilities:
    - LatentPossession
    - GroupCoordination

  spawnWeight:
    depth1: 1.0
    depth2: 1.0
    depth3: 0.2
    depth4: 0.0
    depth5: 0.0

  loot:
    - Items.CommonComponents
    - Items.DataShard_ResearcherLog

  visualEffects:
    eyeGlow: { color: [0.2, 0.5, 1.0], intensity: 0.3 }
    bodyGlow: false
    particleEffect: "minimal_corruption.particle"

Enemies.Possessed_Technician:
  $base: NPCBase
  displayName: "Possessed Technician"
  entityType: "PossessedHuman"
  possessionState: "Active"
  aiEntity: "MinorAI"

  baseStats:
    health: 500
    armor: 100
    damage: 40

  depthModifiers:
    depth2: { health: 1.0, damage: 1.0 }
    depth3: { health: 1.4, damage: 1.4 }
    depth4: { health: 1.8, damage: 1.8 }

  vulnerabilities:
    antiAIWeapons: 3.0
    conventional: 1.0

  abilities:
    - ActivePossession
    - SpreadOnDeath
    - CyberwareEnhanced

  spawnWeight:
    depth1: 0.0
    depth2: 1.0
    depth3: 1.0
    depth4: 0.5
    depth5: 0.2

  loot:
    - Items.UncommonComponents
    - Items.TechParts
    - Items.DataShard_MaintenanceLog

  visualEffects:
    eyeGlow: { color: [0.3, 0.6, 1.0], intensity: 0.7 }
    bodyGlow: true
    particleEffect: "moderate_corruption.particle"

Enemies.Possessed_SecurityGuard:
  $base: NPCBase
  displayName: "Possessed Security Officer"
  entityType: "PossessedHuman"
  possessionState: "Active"
  aiEntity: "MinorAI"
  faction: "Militech"  # Former Militech facility security

  baseStats:
    health: 800
    armor: 200
    damage: 60

  depthModifiers:
    depth3: { health: 1.0, damage: 1.0 }
    depth4: { health: 1.5, damage: 1.5 }
    depth5: { health: 2.0, damage: 2.0 }

  vulnerabilities:
