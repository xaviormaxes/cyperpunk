# ==================================================
# AUDIO METADATA
# ==================================================

AudioMetadata.BeyondTheWall:
  modName: "Beyond the Wall"
  version: "0.1.0"
  author: "BTW Development Team"
  description: "Complete audio suite for Beyond the Wall mod - Blackwall breach facility"

  soundConcept: |
    Audio design centered on digital corruption and AI entities:

    - Possession sounds: Merge human and digital - screaming data mixed with distorted voices
    - Depth ambient: Progressive degradation from subtle static to reality-breaking cacophony
    - Weapon sounds: Anti-AI weapons have "digital cutting" quality - tearing through code
    - Exorcism: Building purification - cleansing tones fighting corruption
    - Bosses: Reality-warping presence - their existence distorts sound itself

    Frequency design:
    - AI entities: High-frequency digital screeches layered with sub-bass drones
    - Corruption: Mid-range static and distortion
    - Cleansing: Pure tones in 432Hz - 528Hz range (healing frequencies)

    Spatial audio:
    - Possessed enemies have dual-source audio (human + AI entity location)
    - Depth 5 ambient should be omnidirectional - inescapable
    - Cerberus units have triple-source (three heads)

  technicalNotes: |
    Implementation notes for audio team:

    1. All possession sounds should have slight randomization (±5% pitch, ±10% timing)
       to prevent repetition fatigue

    2. Depth ambients use crossfade transitions (2 second overlap) between zones

    3. Exorcism stacks use additive layering - each stack adds harmonic overtone
       Stack 10 = full chord resolution

    4. Boss presence audio uses sidechaining to duck other sounds (10-15% reduction)
       creating oppressive atmosphere

    5. Weapon sounds have velocity-based variants (soft/medium/hard hits)

    6. All digital sounds processed through:
       - Bitcrusher (8-12 bit)
       - Sample rate reduction (22kHz - 32kHz)
       - Subtle chorus (creates "many voices" effect)

    7. Corruption warnings use Shepard tone (infinitely rising pitch) for urgency

  audioFiles:
    sourceDirectory: "audio/sources/"
    processedDirectory: "audio/processed/"
    bankDirectory: "audio/banks/"
    format: "OGG Vorbis"
    sampleRate: 48000
    bitDepth: 24
