  RABIDS_Controller:
    location: "Depth 5 - Sealed Vault"
    container: "bartmoss_vault"
    requiresQuest: "BTW_UltimatePower"
    requiresMastery: 100

# ==================================================
# Special Mechanics
# ==================================================
AntiAIMechanics:
  BonusDamageCalculation:
    # Base damage * (1 + BonusDamageVsAI/100)
    # E.g., 100 damage with 300% bonus = 400 total damage

  PossessionBreak:
    # Chance to break AI possession on hit
    # Certain weapons guarantee break on critical

  NeuralScramble:
    duration: 10.0
    effect: "Prevents AI spread from this target"

  Exorcism:
    stacksRequired: 10
    stackDuration: 5.0  # Stacks decay after 5s
    effect: "Purges AI completely, prevents re-possession for 30s"

  DigitalBanish:
    duration: 15.0
    effect: "AI entity cannot manifest in physical realm"

# ==================================================
# Lore Timeline
# ==================================================
WeaponHistory:
  2020: "DataKrash - Rache Bartmoss releases R.A.B.I.D.S."
  2025: "First anti-AI weapons developed (crude, ineffective)"
  2030: "Arasaka Oni no Kiru prototype - first successful AI-killer blade"
  2037: "Militech EMP-7B - mass production of anti-AI explosives"
  2038: "NetWatch Neural Disruptor MK.VII - peak of pre-Blackwall tech"
  2041: "ITS Digital Exorcist - last major innovation before Blackwall"
  2044: "Blackwall established - anti-AI weapons deemed obsolete"
  2073: "Facility 7-B collects Pre-Blackwall weapons for research"
  2077: "V discovers arsenal that was supposed to save the world"
