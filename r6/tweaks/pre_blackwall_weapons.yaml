  Arasaka_AIHunter:
    location: "Depth 4 - Security Chief's Corpse"
    lootSource: "possessed_chief_martinez"
    requiresBossFight: true

  Militech_EMPGrenade:
    location: "Depth 2 - Armory"
    container: "grenade_crate_7B"
    quantity: 5

  ITS_Exorcist:
    location: "Depth 3 - ITS Security Office"
    container: "security_safe"
    requiresKeycard: true

  Project_Erebus_Deck:
    location: "Depth 4 - Dr. Chen's Office"
    container: "personal_safe"
