  effectorClassName: "SummonDaemonEffector"
  duration: 30.0

Effectors.BlackwallOverloadEffector:
  $type: gamedataEffector
  effectorClassName: "BlackwallOverloadEffector"
  duration: 20.0

Effectors.StabilizeEffector:
  $type: gamedataEffector
  effectorClassName: "StabilizeEffector"

