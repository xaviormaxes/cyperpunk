  $base: Items.MantisBladesCyberware
  displayName: "Mantis Blades: Void Claws"
  description: "Mantis blades that extended into the void and came back changed. They cut through everything. EVERYTHING."

  quality: IconicItem

  stats:
    damage: 350
    attackSpeed: 3.0
    bleedChance: 100  # Always bleeds

  specialProperties:
    - type: VoidCutting
      description: "Ignores all armor and damage reduction"
      trueDAMage: true
      cannotBeBlocked: true

    - type: BleedingReality
      description: "Bleed deals 500 damage over 5s and spreads to nearby enemies"
      bleedDamage: 100
      bleedDuration: 5.0
      bleedSpreadRadius: 5.0

    - type: AerialExecutioner
      description: "Air attacks banish target to void for 5s"
      airAttackBanish: true
      banishDuration: 5.0

    - type: VoidHunger
      description: "Blades hunger for reality - gain 3 corruption per kill"
      corruptionPerKill: 3

  visualEffects:
    bladeColor: "deep_void_black_purple"
    slashTrail: "reality_tearing"
    bleedEffect: "void_energy_leaking"

  audioEffects:
    deploy: "void_claws_extending"
    slash: "reality_being_cut"
    kill: "void_feeding"

  lore: |
    "These mantis blades passed through a Blackwall breach mid-deployment.
    They spent exactly 0.3 seconds beyond the barrier. They came back
    sharper than possible. They cut through armor, bone, and reality
    equally well."

  location: "Depth 5 - Ripper doc's corpse (fingers still twitching)"

