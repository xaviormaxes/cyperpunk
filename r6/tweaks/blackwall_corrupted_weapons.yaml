# ==================================================
# CRAFTING SPECIFICATIONS
# ==================================================

# Recipe: Corrupt any Iconic weapon
CraftingSpec.BlackwallCorruption:
  displayName: "Blackwall Corruption Process"
  description: "Expose an Iconic weapon to controlled Blackwall breach. Results unpredictable but powerful."

  requirements:
    iconicWeapon: 1  # Any iconic weapon
    blackwallFragment: 5
    stabilizer: 3
    masteryRequired: 80

  process:
    duration: 24.0  # 24 hours
    corruptionCost: 50
    failureChance: 0.2  # 20% chance weapon is destroyed

  results:
    - type: RandomCorruptedVariant
      bonusDamage: 1.5
      addSpecialProperty: true
      addVisualEffect: true

  location: "Unlocked by terminal in Depth 5"
