# Blackwall Facility Area Configuration
# Beyond the Wall Mod - Phase 2
# Defines the Militech Research Facility 7-B layout and zones

# ==================================================
# Facility Overview
# ==================================================
# Name: Militech Research Facility 7-B
# Location: Badlands (repurposed interior)
# Purpose: Blackwall Interface Research
# Status: ABANDONED - Containment Breach 2073
# Current State: Rogue AI infestation

# ==================================================
# Depth Zones
# ==================================================

Zones:
  Depth1_SurfaceContact:
    name: "Surface Contact"
    depth: 1
    description: "Outer facility entrance and security checkpoint"
    position:
      x: -100.0
      y: 50.0
      z: 10.0
    radius: 30.0
    corruptionMultiplier: 1.0
    ambientCorruptionRate: 0.1  # Per second

    features:
      - Stabilizer nodes: 2
      - Terminals: 1 (entry log)
      - Data shards: 1 (Dr. Chen's first log)
      - Enemy spawn: Light (possessed guards)
      - Visual effects: Minimal flickering

    lighting:
      color: [0.8, 0.9, 1.0]  # Slight blue tint
      intensity: 0.9
      flickerChance: 0.05

  Depth2_ProtocolBreach:
    name: "Protocol Breach"
    depth: 2
    description: "Server rooms with active Blackwall connections"
    position:
      x: -150.0
      y: 50.0
      z: 10.0
    radius: 25.0
    corruptionMultiplier: 1.2
    ambientCorruptionRate: 0.2

    features:
      - Stabilizer nodes: 2
      - Terminals: 2 (security logs, system status)
      - Data shards: 2 (Ramirez report, Chen's concerns)
      - Enemy spawn: Moderate (possessed technicians)
      - Visual effects: Screen distortion, HUD glitches

    lighting:
      color: [0.6, 0.7, 1.0]  # Stronger blue
      intensity: 0.7
      flickerChance: 0.15
      glitchEffects: true

  Depth3_DeepDive:
    name: "Deep Dive"
    depth: 3
    description: "Experimental labs with heavy Blackwall corruption"
    position:
      x: -200.0
      y: 50.0
      z: 5.0
    radius: 25.0
    corruptionMultiplier: 1.5
    ambientCorruptionRate: 0.3

    features:
      - Stabilizer nodes: 2
      - Terminals: 2 (corrupted logs, AI messages)
      - Data shards: 2 (Evacuation order, containment breach)
      - Enemy spawn: Heavy (fully possessed, cyberpsychos)
      - Visual effects: Vision blackouts, strong distortion

    lighting:
      color: [0.4, 0.5, 1.0]  # Deep blue
      intensity: 0.5
      flickerChance: 0.25
      glitchEffects: true
      geometryDistortion: true

  Depth4_OldNetInterface:
    name: "Old Net Interface"
    depth: 4
    description: "Blackwall containment core - reality barrier weakens"
    position:
      x: -250.0
      y: 50.0
      z: 0.0
    radius: 20.0
    corruptionMultiplier: 2.0
    ambientCorruptionRate: 0.5

    features:
      - Stabilizer nodes: 1
      - Terminals: 2 (AI communications, warnings)
      - Data shards: 1 (Martinez's final message)
      - Enemy spawn: Very Heavy (AI-controlled enemies)
      - Visual effects: Reality warping, cyberware malfunction

    lighting:
      color: [0.2, 0.3, 1.0]  # Dark blue
      intensity: 0.3
      flickerChance: 0.40
      glitchEffects: true
      geometryDistortion: true
      timeDistortion: true

  Depth5_BeyondTheVeil:
    name: "Beyond the Veil"
    depth: 5
    description: "Breach point - the edge of reality"
    position:
      x: -300.0
      y: 50.0
      z: -5.0
    radius: 15.0
    corruptionMultiplier: 3.0
    ambientCorruptionRate: 1.0

    features:
      - Stabilizer nodes: 1 (critical placement)
      - Terminals: 1 (completely corrupted)
      - Data shards: 1 (Songbird connection)
      - Enemy spawn: Extreme (rogue AI entities)
      - Visual effects: Full corruption, reality breakdown

    lighting:
      color: [0.0, 0.1, 1.0]  # Pure dark blue/black
      intensity: 0.1
      flickerChance: 0.60
      glitchEffects: true
      geometryDistortion: true
      timeDistortion: true
      voidEffects: true

